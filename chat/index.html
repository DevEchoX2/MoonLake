<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar-left">
            <div class="sidebar-tabs">
                <button id="btn-tab-channels" class="tab-btn active" onclick="switchTab('channels')"><i class="fa-solid fa-hashtag"></i></button>
                <button id="btn-tab-dms" class="tab-btn" onclick="switchTab('dms')"><i class="fa-solid fa-message"></i></button>
                <button id="btn-tab-friends" class="tab-btn" onclick="switchTab('friends')"><i class="fa-solid fa-users"></i></button>
            </div>
            
            <div class="tab-panel" id="panel-channels">
                <div class="panel-header">Channels</div>
                <div class="nav-item active" data-channel="general" onclick="switchLocation('channels', 'general')"><i class="fa-solid fa-hashtag"></i> general</div>
                <div class="nav-item" data-channel="lounge" onclick="switchLocation('channels', 'lounge')"><i class="fa-solid fa-hashtag"></i> lounge</div>
            </div>

            <div class="tab-panel hidden" id="panel-dms">
                <div class="panel-header">Direct Messages</div>
                <div class="dms-list" id="dms-list-container"></div>
            </div>

            <div class="tab-panel hidden" id="panel-friends">
                <div class="panel-header">Friends</div>
                <div class="friends-list" id="friends-list-container"></div>
            </div>

            <div class="account-footer">
                <img src="default.png" alt="Profile" id="account-avatar">
                <div class="account-info">
                    <span id="account-name">Guest</span>
                    <span id="account-tag">#0001</span>
                </div>
                <button id="btn-start-call" class="icon-btn" onclick="startVoiceCall()"><i class="fa-solid fa-phone"></i></button>
            </div>
        </aside>

        <main class="chat-viewport">
            <header class="viewport-header">
                <div class="header-title">
                    <i class="fa-solid fa-hashtag" id="header-icon"></i>
                    <h2 id="header-name">general</h2>
                </div>
                <div class="call-banner hidden" id="call-banner">
                    <i class="fa-solid fa-microphone"></i>
                    <span id="call-timer">05:00</span>
                    <button id="btn-end-call" onclick="endVoiceCall()"><i class="fa-solid fa-phone-slash"></i></button>
                </div>
            </header>

            <div class="messages-viewport" id="messages-viewport"></div>

            <div class="reply-preview-bar hidden" id="reply-preview-bar">
                <span>Replying to <b id="reply-target-user"></b></span>
                <button id="btn-cancel-reply" onclick="clearReply()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="chat-input-bar">
                <button class="icon-btn"><i class="fa-solid fa-paperclip"></i></button>
                <input type="text" id="chat-input" placeholder="Message..." autocomplete="off" onkeypress="handleInputKeypress(event)">
                <button id="btn-send-msg" class="icon-btn send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>

            <div id="reaction-picker" class="reaction-picker hidden"></div>
        </main>

        <aside class="sidebar-right">
            <div class="panel-header"><i class="fa-solid fa-user-group"></i> Members</div>
            <div class="section-label">ONLINE — <span id="cnt-online">0</span></div>
            <div class="members-group" id="group-online"></div>
            <div class="section-label">OFFLINE — <span id="cnt-offline">0</span></div>
            <div class="members-group" id="group-offline"></div>
        </aside>
    </div>

    <div class="modal-overlay hidden" id="user-modal">
        <div class="user-card">
            <img src="default.png" id="modal-avatar">
            <h3 id="modal-username">User</h3>
            <p id="modal-uid"></p>
            <div class="modal-actions">
                <button id="btn-action-dm"><i class="fa-solid fa-message"></i> Direct Message</button>
                <button id="btn-action-friend"><i class="fa-solid fa-user-plus"></i> Add Friend</button>
            </div>
            <button class="close-modal" id="btn-close-modal" onclick="closeUserModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="reaction.js"></script>
    <script src="reply.js"></script>
    <script src="dms.js"></script>
    <script src="friends.js"></script>
    <script src="videocall.js"></script>
</body>
</html>
